<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swift-Med Portal | Secure Access</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background elements */
        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="80" cy="40" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="40" cy="80" r="1.5" fill="rgba(255,255,255,0.1)"/><circle cx="90" cy="90" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="10" cy="60" r="1" fill="rgba(255,255,255,0.1)"/></svg>') repeat;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 60px 50px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 450px;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .tagline {
            color: #6b7280;
            font-size: 1rem;
            font-weight: 500;
        }

        .auth-tabs {
            display: flex;
            background: #f8fafc;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 32px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            color: #6b7280;
        }

        .tab-btn.active {
            background: white;
            color: #667eea;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .form-container {
            position: relative;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
            font-size: 0.95rem;
        }

        .input-wrapper {
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fafbfc;
            outline: none;
        }

        .form-group input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            transform: translateY(-1px);
        }

        .input-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .input-icon:hover {
            color: #667eea;
        }

        .submit-btn {
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .forgot-password {
            text-align: center;
            margin-top: 20px;
        }

        .forgot-password a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .forgot-password a:hover {
            color: #5a67d8;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 32px 0;
            color: #9ca3af;
            font-size: 0.9rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }

        .divider span {
            padding: 0 16px;
        }

        .security-note {
            background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
            border: 1px solid #bae6fd;
            border-radius: 12px;
            padding: 16px;
            margin-top: 24px;
            text-align: center;
        }

        .security-note i {
            color: #0284c7;
            margin-right: 8px;
        }

        .security-note span {
            color: #0c4a6e;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .powered-by {
            text-align: center;
            margin-top: 32px;
            color: #9ca3af;
            font-size: 0.85rem;
        }

        .powered-by a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        /* Mobile responsiveness */
        @media (max-width: 480px) {
            .container {
                margin: 20px;
                padding: 40px 30px;
                border-radius: 20px;
            }

            .logo {
                font-size: 2rem;
            }

            .form-group input {
                padding: 14px 16px;
            }

            .submit-btn {
                padding: 14px 20px;
                font-size: 1rem;
            }
        }

        /* Loading animation */
        .loading {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .success-message {
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
            border: 1px solid #86efac;
            color: #065f46;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            font-weight: 500;
        }

        .error-message {
            background: linear-gradient(135deg, #fef2f2, #fecaca);
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    
    <div class="container">
        <div class="logo-section">
            <div class="logo">Swift-Med</div>
            <div class="tagline">Intelligent Medical Billing Portal</div>
        </div>

        <div id="success-message" class="success-message">
            <i class="fas fa-check-circle"></i>
            Account created successfully! Redirecting to Swift-Med...
        </div>

        <div id="error-message" class="error-message">
            <i class="fas fa-exclamation-circle"></i>
            <span id="error-text">Invalid credentials. Please try again.</span>
        </div>

        <div class="auth-tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
            <button class="tab-btn" onclick="switchTab('register')">Create Account</button>
        </div>

        <div class="form-container">
            <!-- Login Form -->
            <form id="login-form" class="auth-form active">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="login-email" required placeholder="Enter your email">
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="login-password" required placeholder="Enter your password">
                        <i class="fas fa-eye input-icon" onclick="togglePassword('login-password', this)"></i>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    <div class="loading"></div>
                    <span>Sign In to Swift-Med</span>
                </button>

                <div class="forgot-password">
                    <a href="#" onclick="showForgotPassword()">Forgot your password?</a>
                </div>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="register-name">Full Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="register-name" required placeholder="Enter your full name">
                        <i class="fas fa-user input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="register-email">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="register-email" required placeholder="Enter your email">
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="register-password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="register-password" required placeholder="Create a strong password">
                        <i class="fas fa-eye input-icon" onclick="togglePassword('register-password', this)"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="register-confirm">Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="register-confirm" required placeholder="Confirm your password">
                        <i class="fas fa-eye input-icon" onclick="togglePassword('register-confirm', this)"></i>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    <div class="loading"></div>
                    <span>Create Account & Access Swift-Med</span>
                </button>
            </form>
        </div>

        <div class="divider">
            <span>Secure Authentication</span>
        </div>

        <div class="security-note">
            <i class="fas fa-shield-alt"></i>
            <span>Your data is protected with enterprise-grade security</span>
        </div>

        <div class="powered-by">
            Powered by <a href="#" onclick="showTexdoraInfo()">Texdora</a> | Medical Billing Excellence
        </div>
    </div>

    <script>
        // User database simulation (in production, this would be a real database)
        let userDatabase = JSON.parse(localStorage.getItem('swiftmed_users') || '{}');

        function switchTab(tab) {
            // Update tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Update forms
            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
            document.getElementById(tab + '-form').classList.add('active');

            // Clear any error messages
            hideMessages();
        }

        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            const isPassword = input.type === 'password';
            
            input.type = isPassword ? 'text' : 'password';
            icon.className = isPassword ? 'fas fa-eye-slash input-icon' : 'fas fa-eye input-icon';
        }

        function showMessage(type, message) {
            hideMessages();
            const messageEl = document.getElementById(type + '-message');
            if (type === 'error') {
                document.getElementById('error-text').textContent = message;
            }
            messageEl.style.display = 'block';
        }

        function hideMessages() {
            document.getElementById('success-message').style.display = 'none';
            document.getElementById('error-message').style.display = 'none';
        }

        function showLoading(form) {
            const button = form.querySelector('.submit-btn');
            const loading = button.querySelector('.loading');
            const span = button.querySelector('span');
            
            loading.style.display = 'inline-block';
            span.textContent = 'Processing...';
            button.disabled = true;
        }

        function hideLoading(form, originalText) {
            const button = form.querySelector('.submit-btn');
            const loading = button.querySelector('.loading');
            const span = button.querySelector('span');
            
            loading.style.display = 'none';
            span.textContent = originalText;
            button.disabled = false;
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function validatePassword(password) {
            return password.length >= 6;
        }

        function saveUser(email, password, name = '') {
            userDatabase[email] = {
                password: btoa(password), // Basic encoding (use proper hashing in production)
                name: name,
                createdAt: new Date().toISOString(),
                lastLogin: new Date().toISOString()
            };
            localStorage.setItem('swiftmed_users', JSON.stringify(userDatabase));
        }

        function authenticateUser(email, password) {
            const user = userDatabase[email];
            if (user && atob(user.password) === password) {
                user.lastLogin = new Date().toISOString();
                localStorage.setItem('swiftmed_users', JSON.stringify(userDatabase));
                return true;
            }
            return false;
        }

        function redirectToSwiftMed() {
            // Store authentication token
            localStorage.setItem('swiftmed_authenticated', 'true');
            localStorage.setItem('swiftmed_auth_time', new Date().toISOString());
            
            // Redirect to Swift-Med application
            setTimeout(() => {
                window.location.href = 'https://swift-med.netlify.app';
            }, 2000);
        }

        // Handle login form
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            if (!validateEmail(email)) {
                showMessage('error', 'Please enter a valid email address');
                return;
            }
            
            if (!validatePassword(password)) {
                showMessage('error', 'Password must be at least 6 characters');
                return;
            }
            
            showLoading(this);
            
            // Simulate API call delay
            await new Promise(resolve => setTimeout(resolve, 1500));
            
            if (authenticateUser(email, password)) {
                hideLoading(this, 'Sign In to Swift-Med');
                showMessage('success', 'Login successful! Redirecting...');
                redirectToSwiftMed();
            } else {
                hideLoading(this, 'Sign In to Swift-Med');
                showMessage('error', 'Invalid email or password. Please try again.');
            }
        });

        // Handle register form
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm').value;
            
            if (!name.trim()) {
                showMessage('error', 'Please enter your full name');
                return;
            }
            
            if (!validateEmail(email)) {
                showMessage('error', 'Please enter a valid email address');
                return;
            }
            
            if (!validatePassword(password)) {
                showMessage('error', 'Password must be at least 6 characters');
                return;
            }
            
            if (password !== confirmPassword) {
                showMessage('error', 'Passwords do not match');
                return;
            }
            
            if (userDatabase[email]) {
                showMessage('error', 'An account with this email already exists');
                return;
            }
            
            showLoading(this);
            
            // Simulate API call delay
            await new Promise(resolve => setTimeout(resolve, 2000));
            
            saveUser(email, password, name);
            hideLoading(this, 'Create Account & Access Swift-Med');
            showMessage('success', 'Account created successfully! Redirecting to Swift-Med...');
            redirectToSwiftMed();
        });

        function showForgotPassword() {
            alert('Password reset functionality would be implemented here.\n\nFor now, please contact support at:\nsupport@texdora.com');
        }

        function showTexdoraInfo() {
            alert('Texdora - Leading provider of AI-powered medical billing and coding solutions.\n\nVisit our website to learn more about our services.');
        }

        // Add floating animation to background
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.container');
            
            // Add subtle floating animation
            setInterval(() => {
                container.style.transform = `translateY(${Math.sin(Date.now() * 0.001) * 2}px)`;
            }, 16);
        });

        // Enhanced form validation with real-time feedback
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', function() {
                this.style.borderColor = '#e5e7eb';
                hideMessages();
            });
            
            input.addEventListener('blur', function() {
                if (this.type === 'email' && this.value && !validateEmail(this.value)) {
                    this.style.borderColor = '#ef4444';
                } else if (this.type === 'password' && this.value && !validatePassword(this.value)) {
                    this.style.borderColor = '#ef4444';
                }
            });
        });

        console.log('🚀 Swift-Med Authentication Portal Loaded');
        console.log('🔐 Secure access to medical billing system');
        console.log('🏢 Powered by Texdora');
    </script>
</body>
</html>
