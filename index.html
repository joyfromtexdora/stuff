<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swift-Med Portal | Secure Access</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .loading-container {
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -2px;
        }

        .loading-text {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(239, 68, 68, 0.9);
            color: white;
            padding: 1rem 2rem;
            border-radius: 10px;
            margin-top: 2rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="logo">Swift-Med</div>
        <div class="loading-text" id="loadingText">Checking authentication...</div>
        <div class="spinner"></div>
        <div class="error-message" id="errorMessage">
            Unable to redirect. <a href="/auth.html" style="color: white; text-decoration: underline;">Click here to continue</a>
        </div>
    </div>

    <script>
        function checkAuthentication() {
            const isAuthenticated = localStorage.getItem('swiftmed_authenticated');
            const authTime = localStorage.getItem('swiftmed_auth_time');
            const currentUser = localStorage.getItem('swiftmed_current_user');
            
            // Check if authentication is recent (within 24 hours)
            const isAuthRecent = authTime && (Date.now() - new Date(authTime).getTime() < 24 * 60 * 60 * 1000);
            
            setTimeout(() => {
                if (isAuthenticated && isAuthRecent && currentUser) {
                    // User is authenticated, redirect to main app
                    document.getElementById('loadingText').textContent = 'Welcome back! Redirecting to dashboard...';
                    setTimeout(() => {
                        window.location.href = '/app.html';
                    }, 1500);
                } else {
                    // User not authenticated, redirect to login
                    document.getElementById('loadingText').textContent = 'Redirecting to secure login...';
                    setTimeout(() => {
                        window.location.href = '/auth.html';
                    }, 1500);
                }
            }, 1000); // Short delay for smooth user experience
        }

        // Handle any errors in redirection
        window.addEventListener('error', function() {
            document.getElementById('errorMessage').style.display = 'block';
        });

        // Start authentication check
        checkAuthentication();

        // Fallback redirect if something goes wrong
        setTimeout(() => {
            if (window.location.pathname === '/') {
                window.location.href = '/auth.html';
            }
        }, 5000);
    </script>
</body>
</html>
